<div style="display: grid; gap: 0.75rem; max-width: 32rem;">
<div role="note" data-variant="default" class="dx-callout-css">
<p class="dx-callout-title-css">Heads up
</p>
<div class="dx-callout-body-css">Callouts are static notes. Use 
<code>Alert
</code> to interrupt.
</div>
</div>
<div role="note" data-variant="info" class="dx-callout-css">
<p class="dx-callout-title-css">Tip
</p>
<div class="dx-callout-body-css">Press / to open the command palette.
</div>
</div>
<div role="note" data-variant="success" class="dx-callout-css">
<div class="dx-callout-body-css">Saved. Your changes are live.
</div>
</div>
<div role="note" data-variant="warning" class="dx-callout-css">
<p class="dx-callout-title-css">Careful
</p>
<div class="dx-callout-body-css">This replaces the existing file.
</div>
</div>
</div>
