remarks = "`Marquee` pauses on hover and focus and stops under reduced motion; the carousel does not auto-advance; spinners and shimmer are static under reduced motion."
evidence = ["crates/ui/src/components/marquee/style.css", "tests/e2e/motion.mjs"]
components = ["marquee", "carousel", "spinner", "shimmer"]

