<div style="display: grid; gap: 1rem; max-width: 22rem;">
<form novalidate=true class="dx-form-css">
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n0" class="dx-field-label-css">Email
</label>
<input aria-describedby="dx-field-n0-description" autocomplete="email" class="dx-input-css" id="dx-field-n0" placeholder="you@example.com" type="email" value="">
</input>
<p id="dx-field-n0-description" class="dx-field-description-css">We never share it.
</p>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n1" class="dx-field-label-css">Password
</label>
<input autocomplete="new-password" class="dx-input-css" id="dx-field-n1" type="password" value="">
</input>
</div>
<button class="dx-button-css" data-size="default" data-style="primary" type="submit">Create account
</button>
</form>
</div>
