\* Mutant: the loop forgets to clear `looping` when it finds the slot empty (after a stop).
\* The next animate() then starts no loop and the animation never moves.
\* scripts/tla.sh expects NoFrozenAnimation to fail.
CONSTANTS
    Targets = {"a", "b"}
    MaxFrames = 2
    MaxActions = 5
    BugNoLoopGuard = FALSE
    BugKeepLooping = TRUE
SPECIFICATION Spec
INVARIANTS NoFrozenAnimation
