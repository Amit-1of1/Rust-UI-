name: WebKit trap hunt (temporary)

# Diagnostic only, removed before the PR is ready: loads the gallery many times in WebKit under
# different builds and JSC options to find what the start-up wasm trap depends on.
on:
  push:
    branches: [claude/project-thread-qxng8s]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: scripts/install-dx.sh
      - name: builds
        run: |
          for app in gallery site docs dashboard booking; do
            scripts/release-web.sh $app
          done
          mkdir -p web/ci-split && cp -r target/dx/gallery/release/web/public/. web/ci-split/
      - run: tar -cf web.tar web target/dx/*/release/web/public
      - uses: actions/upload-artifact@v4
        with:
          name: trap-web
          path: web.tar
          retention-days: 3

  stress:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pw156-a, build: ci-split, pw: "" }
          - { name: pw156-b, build: ci-split, pw: "" }
          - { name: pw156-c, build: ci-split, pw: "" }
          - { name: pw163-a, build: ci-split, pw: "1.63.0" }
          - { name: pw163-b, build: ci-split, pw: "1.63.0" }
          - { name: pw163-c, build: ci-split, pw: "1.63.0" }
          - { name: env-sanity-nosandbox, build: ci-split, pw: "", env: "WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 JSC_useWebAssembly=0", loads: 1 }
          - { name: env-sanity-jsc-only, build: ci-split, pw: "", env: "JSC_useJIT=0 JSC_useWebAssembly=0", loads: 1 }
    name: stress (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trap-web
      - run: tar -xf web.tar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - if: matrix.pw != ''
        run: npm i --no-save playwright@${{ matrix.pw }}
        working-directory: tests/e2e
      - run: npx playwright --version && npx playwright install --with-deps webkit
        working-directory: tests/e2e
      - name: stress
        run: |
          python3 -m http.server 8765 --directory web/${{ matrix.build }} >/dev/null 2>&1 &
          sleep 1
          cd tests/e2e
          env ${{ matrix.env }} BROWSER=webkit LOADS=${{ matrix.loads || 150 }} GALLERY_URL=http://localhost:8765/ node start_stress.mjs

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: [a, b, c]
    name: e2e webkit, playwright 1.63 (${{ matrix.run }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trap-web
      - run: tar -xf web.tar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci && npm i --no-save playwright@1.63.0
        working-directory: tests/e2e
      - run: npx playwright install --with-deps webkit
        working-directory: tests/e2e
      - run: scripts/e2e.sh --prebuilt --release --browsers webkit
