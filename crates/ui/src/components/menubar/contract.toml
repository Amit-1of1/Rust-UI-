# Keyboard and accessibility contract (docs/CONTRACTS.md): the docs table is generated from it,
# and tests/e2e/contracts.mjs (web) and apps/native/tests/contracts.rs (Blitz) run every row.
pattern = "Menu Bar"
apg = "menubar"
roles = ["menubar", "menu", "menuitem"]
gaps = [
    "Submenus open to the inline end and do not flip at screen edges; in right-to-left text ArrowRight still opens and ArrowLeft still closes.",
]

[parts]
bar = "[role=menubar]"
menu = "[role=menubar] > [role=menu]"
top = "[role=menubar] > [role=menu] > [role=menuitem]"
item = "[role=menubar] [role=menu] [role=menu] [role=menuitem]"
subtrigger = "[role=menubar] [role=menuitem][aria-haspopup=menu]"
sublist = "[role=menubar] [role=menu] [role=menu] [role=menu]"
subitem = "[role=menubar] [role=menu] [role=menu] [role=menu] [role=menuitem]"

[[states]]
name = "file-open"
means = "The first menu is open."
check = "attr menu@1 data-state=open"

[[states]]
name = "file-closed"
means = "The first menu is closed."
check = "attr menu@1 data-state=closed"

[[keys]]
key = "ArrowRight"
when = "On a menu bar item"
does = "Moves focus to the next menu bar item."
native = true
test = """
focus bar
press ArrowRight
focused top@2
focus-in bar
"""

[[keys]]
key = "ArrowLeft"
when = "On a menu bar item"
does = "Moves focus to the previous menu bar item."
native = true
test = """
focus bar
press ArrowRight
press ArrowLeft
focused top@1
"""

[[keys]]
key = "ArrowDown"
when = "On a menu bar item"
does = "Opens its menu and moves focus to the first item."
native = true
test = """
focus top@1
press ArrowDown
state file-open
visible item@1
focus-in menu@1
"""

[[keys]]
key = "Enter"
when = "On a menu bar item"
does = "Opens or closes its menu."
native = true
test = """
focus top@1
press Enter
state file-open
"""

[[keys]]
key = "Escape"
when = "In an open menu"
does = "Closes the menu."
native = true
test = """
focus top@1
press ArrowDown
press Escape
state file-closed
"""

[[keys]]
key = "Escape"
when = "After the menu closes"
does = "Focus goes back to the menubar item that opened it."
native = false
test = """
focus top@1
press ArrowDown
press Escape
focused top@1
"""

[[keys]]
key = "ArrowRight"
when = "On an item with a submenu"
does = "Opens the submenu and moves focus to its first item."
native = true
test = """
focus top@1
press ArrowDown*2
focused subtrigger@1
attr subtrigger@1 aria-expanded=false
press ArrowRight
visible sublist
attr subtrigger@1 aria-expanded=true
focused subitem@1
"""

[[keys]]
key = "ArrowLeft"
when = "In a submenu"
does = "Closes the submenu and returns focus to the item that opened it."
native = true
test = """
focus top@1
press ArrowDown*2
press ArrowRight
press ArrowLeft
hidden sublist
focused subtrigger@1
state file-open
"""

[[keys]]
key = "Escape"
when = "In a submenu"
does = "Closes only the submenu; focus goes back to the item that opened it."
native = true
test = """
focus top@1
press ArrowDown*2
press ArrowRight
press Escape
hidden sublist
focused subtrigger@1
state file-open
"""
