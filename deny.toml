# cargo deny check (CI job `deny` in .github/workflows/ci.yml). Rules: docs/GUARDRAILS.md,
# "Dependency traps".

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable and yanked crates fail; unmaintained ones only warn when
# they reach us directly.
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # quick-xml 0.30 via zbus_xml (accesskit's Linux screen-reader bridge, native only). It
  # parses the D-Bus interface XML that ships inside those crates, never input from users.
  # Drop once Blitz moves to accesskit with zbus 5.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml only parses bundled D-Bus XML (native)" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml only parses bundled D-Bus XML (native)" },
]

[licenses]
# Permissive licences only; GPL and no-licence crates must never get in.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft: fine to depend on unmodified (Blitz's font and text stack).
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
[sources.allow-org]
# Only our own forks, each pinned by rev in [patch] (docs/FORKS.md).
github = ["Amit-1of1"]
