<main class="dx-block-login-css" data-block="login_01">
<div class="dx-card-css dx-block-login-card-css" data-slot="card">
<div class="dx-card-header-css" data-slot="card-header">
<div class="dx-card-title-css" data-slot="card-title">
<h1 class="dx-block-login-title-css">Sign in
</h1>
</div>
<div class="dx-card-description-css" data-slot="card-description">Enter your email and password to continue.
</div>
</div>
<div class="dx-card-content-css" data-slot="card-content">
<form novalidate=true aria-label="Sign in" class="dx-form-css">
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n0" class="dx-field-label-css">Email
</label>
<input autocomplete="email" class="dx-input-css" id="dx-field-n0" placeholder="you@example.com" type="email" value="">
</input>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n1" class="dx-field-label-css">Password
</label>
<input autocomplete="current-password" class="dx-input-css" id="dx-field-n1" type="password" value="">
</input>
</div>
<div class="dx-block-login-row-css">
<div data-slot="field" class="dx-field-css">
<div class="dx-form-check-css">
<button type="button" value="on" role="checkbox" aria-checked="false" aria-required=false data-state="unchecked" data-disabled=false class="dx-checkbox-css" id="dx-field-n2">
<span data-state="unchecked" data-disabled=false class="dx-checkbox-indicator-css">
</span>
</button>
<input id="dxc-n0" type="checkbox" aria-hidden="true" tabindex="-1" name="" value="on" style="position:absolute;pointer-events:none;opacity:0;margin:0;transform:translateX(-100%);"/>
<label for="dx-field-n2" class="dx-field-label-css">Remember me
</label>
</div>
</div>
<a href="#forgot-password" class="dx-link-css">Forgot password?
</a>
</div>
<button class="dx-button-css dx-block-login-submit-css" data-size="default" data-style="primary" type="submit">Sign in
</button>
</form>
</div>
<div class="dx-card-footer-css" data-slot="card-footer">
<p class="dx-block-login-footer-css">No account yet? 
<a href="#sign-up" class="dx-link-css">Sign up
</a>
</p>
</div>
</div>
</main>
