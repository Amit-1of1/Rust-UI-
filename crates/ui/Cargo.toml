[package]
name = "atoll-ui"
version = "0.1.0"
description = "Personal shadcn-inspired component kit for Dioxus"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dioxus", "ui", "components", "shadcn"]
categories = ["gui", "wasm"]
# crates.io rejects git dependencies, and dioxus-primitives is git-only (crates.io holds an
# empty 0.0.0 placeholder). Install from git or copy components instead; docs/PUBLISHING.md.
publish = false

[lib]
name = "ui"

[dependencies]
dioxus.workspace = true
dioxus-primitives.workspace = true
motion.workspace = true
form-derive.workspace = true
time = { version = "0.3.44", features = ["std", "macros"] }
palette = "0.7.6"
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1"
# Timers that work on the web and native (already used by dioxus-primitives).
dioxus-sdk-time = "0.7.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "KeyboardEvent", "EventTarget", "MediaQueryList", "Navigator", "Clipboard", "Storage", "AudioContext", "AudioContextState", "BaseAudioContext", "AudioNode", "AudioParam", "AudioDestinationNode", "AudioScheduledSourceNode", "GainNode", "OscillatorNode", "OscillatorType", "Blob", "BlobPropertyBag", "Url"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[build-dependencies]
# build.rs checks every component's contract.toml (crates/cli/src/contract.rs), with the
# `contract-check` feature.
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }

[dev-dependencies]
# The integration tests walk every demo.
atoll-ui = { path = ".", features = ["demos", "contract-check"] }
dioxus-ssr = "0.7.0"
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
# The gallery and docs demos (`ui::demos`). Off by default so apps don't ship demo code and
# demo CSS; the gallery, the docs site, apps/native and the kit's own tests turn it on.
# Internal (docs/STABILITY.md).
demos = ["blocks"]
# Whole-screen blocks (`ui::blocks`): copy them with `atoll add`, or turn this on to use them
# in place. Internal (docs/STABILITY.md).
blocks = []
# build.rs checks every contract.toml against the CLI's rules (crates/cli/src/contract.rs). Only
# builds inside this repository, where that file exists: the kit's tests and the apps turn it
# on. Internal (docs/STABILITY.md).
contract-check = ["dep:serde", "dep:toml"]
web = ["dioxus-primitives/web", "motion/web"]
desktop = ["motion/desktop"]
# dioxus-native (Blitz). Nothing in the kit needs it any more (docs/NATIVE.md); kept so
# apps that turn it on keep building. Experimental (docs/STABILITY.md).
native = []
# Kit links (`TextLink`, `BreadcrumbLink`, `PaginationLink`) navigate through the Dioxus router
# when one is present, and `MainContent` moves focus after a route change. Experimental
# (docs/STABILITY.md).
router = ["dioxus/router"]
