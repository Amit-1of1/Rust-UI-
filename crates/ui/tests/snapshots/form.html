<div style="display: grid; gap: 1rem; max-width: 22rem;">
<form novalidate=true class="dx-form-css">
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n0" class="dx-field-label-css">Email
</label>
<input aria-describedby="dx-field-n0-description" autocomplete="email" class="dx-input-css" id="dx-field-n0" placeholder="you@example.com" type="email" value="">
</input>
<p id="dx-field-n0-description" class="dx-field-description-css">We never share it.
</p>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n1" class="dx-field-label-css">Password
</label>
<input autocomplete="new-password" class="dx-input-css" id="dx-field-n1" type="password" value="">
</input>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n2" class="dx-field-label-css" id="dx-field-n2-label">Role
</label>
<div data-state="closed" data-disabled=false class="dx-select-css">
<button type="button" aria-haspopup="listbox" aria-expanded=false aria-labelledby="dx-field-n2-label dx-field-n2" class="dx-select-trigger-css" id="dx-field-n2">
<span data-placeholder=true>Choose a role
</span>
<svg aria-hidden="true" class="dx-select-expand-icon" data-icon="chevron-down" data-stroke="theme" fill="none" height="20px" stroke="var(--primary-color-n0)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20px" xmlns="http://www.w3.org/2000/svg">
<path d="m6 9 6 6 6-6">
</path>
</svg>
</button>
</div>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n3" class="dx-field-label-css" id="dx-field-n3-label">Time zone
</label>
<div data-state="closed" data-disabled=false class="dx-combobox-css">
<div class="dx-combobox-input-wrapper-css">
<input type="text" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" id="dx-field-n3" value="" placeholder="Search time zones" aria-expanded=false data-state="closed" aria-describedby="dx-field-n3-description" aria-labelledby="dx-field-n3-label" class="dx-combobox-input-css"/>
<svg aria-hidden="true" class="dx-combobox-expand-icon-css" data-icon="chevrons-up-down" data-stroke="theme" fill="none" height="16px" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16px" xmlns="http://www.w3.org/2000/svg">
<path d="m7 15 5 5 5-5">
</path>
<path d="m7 9 5-5 5 5">
</path>
</svg>
</div>
</div>
<p id="dx-field-n3-description" class="dx-field-description-css">Resets to UTC.
</p>
</div>
<button class="dx-button-css" data-size="default" data-style="primary" type="submit">Create account
</button>
</form>
</div>
