\* Mutant: animate() spawns a second loop while one runs.
\* scripts/tla.sh expects OneLoop to fail.
CONSTANTS
    Targets = {"a", "b"}
    MaxFrames = 2
    MaxActions = 5
    BugNoLoopGuard = TRUE
    BugKeepLooping = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK OneLoop NoFrozenAnimation AnimatingIsTrue LoopingIsTrue RestsAtGoal
PROPERTIES NoWriteAfterUnmount Settles LoopsEnd
