# Keyboard and accessibility contract (docs/CONTRACTS.md). The docs page and llms/dialog.md show
# the table generated from it; tests/e2e/contracts.mjs and apps/native/tests/contracts.rs run
# every row against the demo.
pattern = "Dialog (Modal)"
apg = "dialog-modal"
roles = ["dialog"]


[parts]
trigger = "button"
dialog = "[role=dialog]"

[[states]]
name = "open"
means = "The dialog is shown over the page."
check = "visible dialog"

[[states]]
name = "closed"
means = "Only the trigger is shown."
check = "hidden dialog"

[[keys]]
key = "Enter"
when = "On the button that opens it"
does = "Opens the dialog and moves focus into it."
native = true
test = """
focus trigger
press Enter
state open
focus-in dialog
"""

[[keys]]
key = "Space"
when = "On the button that opens it"
does = "Opens the dialog and moves focus into it."
native = true
test = """
focus trigger
press Space
state open
focus-in dialog
"""

[[keys]]
key = "Tab"
when = "Inside the dialog"
does = "Moves to the next control; from the last one it wraps to the first, so focus stays in the dialog."
native = true
test = """
focus trigger
press Enter
press Tab*6
state open
focus-in dialog
"""

[[keys]]
key = "Shift+Tab"
when = "Inside the dialog"
does = "Moves to the previous control, wrapping from the first to the last."
native = true
test = """
focus trigger
press Enter
press Shift+Tab*6
state open
focus-in dialog
"""

[[keys]]
key = "Escape"
when = "Inside the dialog"
does = "Closes the dialog and returns focus to the button that opened it."
native = true
test = """
focus trigger
press Enter
press Escape
state closed
focused trigger
"""
