name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # The sync-prs workflow starts it on PR branches it pushed to.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a newer push (or the sync bot's dispatch after a merge to main) cancels
# the older run on a PR branch. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Same split as scripts/check.sh: in one workspace run the gallery's `web` feature reaches
      # the motion crate, which then calls JavaScript inside the headless native tests.
      - run: cargo test --workspace --exclude native
      - run: cargo test -p native
      - run: cargo build -p gallery --target wasm32-unknown-unknown

  # Known-vulnerable or yanked crates, licences outside deny.toml's list, and git sources other
  # than our pinned forks (docs/GUARDRAILS.md: dependency traps).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        if: hashFiles('deny.toml') != ''
        with:
          command: check advisories bans licenses sources
