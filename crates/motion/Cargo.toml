[package]
name = "atoll-motion"
version = "0.1.0"
description = "Motion helpers for the Atoll kit: spring presets, reduced-motion handling and presence animations"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dioxus", "animation", "spring", "motion"]
categories = ["gui", "wasm"]

[lib]
name = "motion"

[dependencies]
dioxus.workspace = true
# Exact pin: one-maintainer crate whose API changes between minors (docs/GUARDRAILS.md).
# dioxus-motion has no Dioxus 0.8 release: its 0.4.0 ported to 0.8, kept next to the primitives fork
# (same repository and commit) until it has a fork of its own. A git dependency, not a
# [patch.crates-io], so an app that uses the kit gets it without a patch of its own.
dioxus-motion = { version = "=0.4.0", git = "https://github.com/Amit-1of1/dioxus-components", rev = "753e824dd5bdf6698f4ded2de731af7e5619170b", default-features = false, features = ["dioxus"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "MediaQueryList", "Performance", "PointerEvent", "Element", "Event", "EventTarget", "DomRect"] }

[dev-dependencies]
dioxus-ssr = "=0.8.0-alpha.3"

[features]
web = ["dioxus-motion/web"]
desktop = ["dioxus-motion/desktop"]
