\* Mutant: the code before the fix, with OldKeepSeenTop = TRUE: a scroll event queued before "Jump to latest" lets go right after it.
\* scripts/tla.sh expects UnpinsOnlyForReader to fail.
CONSTANTS
    MaxH = 2
    V = 1
    MaxReader = 2
    MaxJumps = 1
    Events = TRUE
    OldStaleTop = FALSE
    OldTrustAfter = FALSE
    OldScrollToSize = FALSE
    OldNoEpoch = FALSE
    OldKeepSeenTop = TRUE
SPECIFICATION Spec
INVARIANTS UnpinsOnlyForReader
