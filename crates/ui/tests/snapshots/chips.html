<div style="display: flex; flex-direction: column; gap: 0.75rem;">
<div role="group" aria-label="Filter by status" class="dx-chips-css">
<label data-state="on" class="dx-chip-css">
<input type="checkbox" class="dx-chip-input-css" checked=true/>
<span aria-hidden="true" class="dx-chip-check-css">
<svg aria-hidden="true" data-icon="check" fill="none" height="0.875rem" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width=3 viewBox="0 0 24 24" width="0.875rem" xmlns="http://www.w3.org/2000/svg">
<path d="M20 6 9 17l-n0-n0">
</path>
</svg>
</span>
<span>Open
</span>
</label>
<label data-state="off" class="dx-chip-css">
<input type="checkbox" class="dx-chip-input-css"/>
<span aria-hidden="true" class="dx-chip-check-css">
<svg aria-hidden="true" data-icon="check" fill="none" height="0.875rem" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width=3 viewBox="0 0 24 24" width="0.875rem" xmlns="http://www.w3.org/2000/svg">
<path d="M20 6 9 17l-n0-n0">
</path>
</svg>
</span>
<span>In review
</span>
</label>
<label data-state="off" class="dx-chip-css">
<input type="checkbox" class="dx-chip-input-css"/>
<span aria-hidden="true" class="dx-chip-check-css">
<svg aria-hidden="true" data-icon="check" fill="none" height="0.875rem" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width=3 viewBox="0 0 24 24" width="0.875rem" xmlns="http://www.w3.org/2000/svg">
<path d="M20 6 9 17l-n0-n0">
</path>
</svg>
</span>
<span>Done
</span>
</label>
<label data-state="off" data-disabled="true" class="dx-chip-css">
<input type="checkbox" class="dx-chip-input-css" disabled=true/>
<span aria-hidden="true" class="dx-chip-check-css">
<svg aria-hidden="true" data-icon="check" fill="none" height="0.875rem" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width=3 viewBox="0 0 24 24" width="0.875rem" xmlns="http://www.w3.org/2000/svg">
<path d="M20 6 9 17l-n0-n0">
</path>
</svg>
</span>
<span>Archived
</span>
</label>
</div>
<p style="margin: 0; font-size: 0.875rem; color: var(--secondary-color-n0);">Hiding done tasks.
</p>
</div>
