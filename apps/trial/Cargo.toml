[package]
name = "trial"
version = "0.1.0"
description = "Taskboard: a small app that exercises the kit end to end, and the Rust side of bench/"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dioxus.workspace = true
ui.workspace = true
tracing = { version = "0.1", features = ["release_max_level_off"] }
log = { version = "0.4", features = ["release_max_level_off"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "DomStringMap", "Location"] }

[features]
default = ["web"]
web = ["dioxus/web", "ui/web"]
desktop = ["dioxus/desktop", "ui/desktop"]
# Load the Stats and Settings tabs, the dialogs and the bench page on first use (`dx build --wasm-split`).
wasm-split = ["dioxus/wasm-split"]
