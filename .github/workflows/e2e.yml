name: Browser checks

# scripts/e2e.sh on Chromium, Firefox and WebKit: axe, keyboard, accessibility tree and the
# behaviour scripts in tests/e2e. The apps are built once and shared with each engine's job.
# Release builds: WebKit on a runner times out on, or crashes in, the 16 MB debug wasm.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a newer push (or the sync bot's dispatch after a merge to main) cancels
# the older run on a PR branch. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned: release wasm builds on newer stable (LLVM 23) lose the __wasm_bindgen_unstable
      # section to strip = true in [profile.release] (dx builds a wasm-release profile from it).
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # dx from the fork: stock 0.7.10's splitter drops or crashes on the lazy parts (docs/FORKS.md).
      # cargo install of the fork takes ~10 minutes; keep the binary between runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dx
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ runner.os }}-${{ hashFiles('scripts/install-dx.sh') }}
      - if: steps.dx.outputs.cache-hit != 'true'
        run: scripts/install-dx.sh
      # Built as Pages ships them: gallery and dashboard split, CSS bundled (scripts/release-web.sh).
      - run: |
          for app in gallery site docs dashboard booking showcase; do
            scripts/release-web.sh $app
          done
      # The component contracts' test steps, for tests/e2e/contracts.mjs (no Rust in the e2e job).
      - run: cargo run -q -p rust-ui-cli -- contract --json > target/contracts.json
      - run: tar -cf web.tar target/dx/*/release/web/public target/contracts.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: web.tar
          retention-days: 3

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
      - run: tar -xf web.tar
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: tests/e2e
      - run: scripts/e2e.sh --prebuilt --release --browsers ${{ matrix.browser }}
