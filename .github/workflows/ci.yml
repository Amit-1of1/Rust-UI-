name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Same split as scripts/check.sh: in one workspace run the gallery's `web` feature reaches
      # the motion crate, which then calls JavaScript inside the headless native tests.
      - run: cargo test --workspace --exclude native
      - run: cargo test -p native
      - run: cargo build -p gallery --target wasm32-unknown-unknown
