<div style="display:flex;flex-direction:column;gap:1.5rem;">
<p id="textarea-message">Description here: sample text
</p>
<div style="display:flex;flex-direction:column;gap:.5rem;justify-content:center;">
<label for="default" class="dx-label-css">Default
</label>
<textarea data-slot="textarea" data-style="default" class="dx-textarea-css" id="default" placeholder="Enter your description" value="sample text">
</textarea>
</div>
<div style="display:flex;flex-direction:column;gap:.5rem;">
<label for="autosize" class="dx-label-css">Grows as you type
</label>
<textarea data-slot="textarea" data-style="default" data-autosize="true" class="dx-textarea-css" id="autosize" placeholder="Write a few lines">
</textarea>
</div>
</div>
