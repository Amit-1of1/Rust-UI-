[workspace]
resolver = "3"
members = ["crates/ui", "crates/motion", "crates/cli", "apps/gallery", "apps/site"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Pinned to a minor version on purpose; see docs/GUARDRAILS.md.
dioxus = "0.7.10"
# Git-only upstream, pinned to an exact commit (DioxusLabs/components, 2026-09-07).
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7" }
dioxus-icons = "0.1.0"
ui = { path = "crates/ui", package = "rust-ui-kit" }
motion = { path = "crates/motion", package = "rust-ui-motion" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 0
