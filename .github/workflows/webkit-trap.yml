name: WebKit trap hunt (temporary)

# Diagnostic only, removed before the PR is ready: loads the gallery many times in WebKit under
# different builds and JSC options to find what the start-up wasm trap depends on.
on:
  push:
    branches: [claude/project-thread-qxng8s]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: scripts/install-dx.sh
      - name: builds
        run: |
          set -x
          keep() { mkdir -p web/$1 && cp -r target/dx/gallery/release/web/public/. web/$1/; }
          # As CI ships it.
          scripts/release-web.sh gallery && keep ci-split
          # Same, but no postbuild: wasm keeps its names, so stacks name functions.
          rm -rf target/dx/gallery/release/web/public
          (cd apps/gallery && dx build --release --platform web --wasm-split --features wasm-split "--rustc-args=-C link-arg=-O0") && keep named-split
          # Not split.
          rm -rf target/dx/gallery/release/web/public
          (cd apps/gallery && dx build --release --platform web) && keep unsplit
          # Split, with 256 MB of memory from the start, so the heap never grows the memory.
          rm -rf target/dx/gallery/release/web/public
          (cd apps/gallery && dx build --release --platform web --wasm-split --features wasm-split "--rustc-args=-C link-arg=-O0 -C link-arg=--initial-memory=268435456") && keep bigmem-split
          ls -la web/*/assets/*.wasm
      - run: tar -cf web.tar web
      - uses: actions/upload-artifact@v4
        with:
          name: trap-web
          path: web.tar
          retention-days: 3

  stress:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: control, build: ci-split, env: "" }
          - { name: control-2, build: ci-split, env: "" }
          - { name: env-sanity-no-wasm, build: ci-split, env: "JSC_useWebAssembly=0", loads: 2 }
          - { name: no-omg, build: ci-split, env: "JSC_useOMGJIT=0" }
          - { name: no-bbq, build: ci-split, env: "JSC_useBBQJIT=0" }
          - { name: no-concurrent-jit, build: ci-split, env: "JSC_useConcurrentJIT=0" }
          - { name: no-fast-memory, build: ci-split, env: "JSC_useWebAssemblyFastMemory=0" }
          - { name: named, build: named-split, env: "" }
          - { name: unsplit, build: unsplit, env: "" }
          - { name: bigmem, build: bigmem-split, env: "" }
          - { name: bigmem-2, build: bigmem-split, env: "" }
    name: stress (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trap-web
      - run: tar -xf web.tar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps webkit
        working-directory: tests/e2e
      - name: stress
        run: |
          python3 -m http.server 8765 --directory web/${{ matrix.build }} >/dev/null 2>&1 &
          sleep 1
          cd tests/e2e
          env ${{ matrix.env }} BROWSER=webkit LOADS=${{ matrix.loads || 80 }} GALLERY_URL=http://localhost:8765/ node start_stress.mjs
