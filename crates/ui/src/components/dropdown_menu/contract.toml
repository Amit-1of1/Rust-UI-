# Keyboard and accessibility contract (docs/CONTRACTS.md): the docs table is generated from it,
# and tests/e2e/contracts.mjs (web) and apps/native/tests/contracts.rs (Blitz) run every row.
pattern = "Menu Button"
apg = "menu-button"
roles = ["listbox", "option"]
gaps = [
    "The items are a `listbox` of `option`s, not a `menu` of `menuitem`s (upstream markup).",
    "Opening does not move focus to the first item; the first arrow key does.",
    "A submenu's item is an `option`, which cannot carry `aria-haspopup` or `aria-expanded`; it names its open list with `aria-controls` instead, and that list is a `group` of options labelled by the item (a listbox cannot hold a listbox).",
    "Submenus open to the inline end and do not flip at screen edges; in right-to-left text ArrowRight still opens and ArrowLeft still closes.",
]

[parts]
trigger = "button[aria-haspopup]"
list = "[role=listbox]"
item = "[role=option]"
subtrigger = "[role=option][data-state]"
sublist = "[role=listbox] [role=group]"
subitem = "[role=listbox] [role=group] [role=option]"

[[states]]
name = "open"
means = "The list of actions is shown."
check = "attr trigger aria-expanded=true"

[[states]]
name = "closed"
means = "Only the trigger is shown."
check = "attr trigger aria-expanded=false"

[[keys]]
key = "Enter"
when = "On the trigger"
does = "Opens the menu; focus stays on the trigger until an arrow key moves it in (the APG moves it to the first item at once)."
native = true
test = """
focus trigger
press Enter
state open
visible list
focused trigger
"""

[[keys]]
key = "Space"
when = "On the trigger"
does = "Opens the menu, as Enter does."
native = true
test = """
focus trigger
press Space
state open
visible list
"""

[[keys]]
key = "ArrowDown"
when = "In the open menu"
does = "Moves focus to the first item, then to the next one."
native = true
test = """
focus trigger
press Enter
press ArrowDown
focused item@1
press ArrowDown
focused item@2
focus-in list
"""

[[keys]]
key = "ArrowUp"
when = "In the open menu"
does = "Moves focus to the previous item, wrapping from the first to the last."
native = true
test = """
focus trigger
press Enter
press ArrowDown*2
press ArrowUp
focused item@1
press ArrowUp
focused item@5
"""

[[keys]]
key = "Enter"
when = "On an item"
does = "Chooses the item, closes the menu and returns focus to the trigger."
native = false
test = """
focus trigger
press Enter
press ArrowDown
press Enter
state closed
focused trigger
"""

[[keys]]
key = "Escape"
when = "In the open menu"
does = "Closes the menu and returns focus to the trigger."
native = true
test = """
focus trigger
press Enter
press Escape
state closed
focused trigger
"""

[[keys]]
key = "ArrowRight"
when = "On an item with a submenu"
does = "Opens the submenu and moves focus to its first item."
native = true
test = """
focus trigger
press Enter
press ArrowDown*3
focused subtrigger@1
press ArrowRight
visible sublist
focused subitem@1
"""

[[keys]]
key = "ArrowDown"
when = "In a submenu"
does = "Moves focus to the next item of the submenu; the menu behind it stays put."
native = true
test = """
focus trigger
press Enter
press ArrowDown*3
press ArrowRight
press ArrowDown
focused subitem@2
"""

[[keys]]
key = "ArrowLeft"
when = "In a submenu"
does = "Closes the submenu and returns focus to the item that opened it."
native = true
test = """
focus trigger
press Enter
press ArrowDown*3
press ArrowRight
press ArrowLeft
hidden sublist
focused subtrigger@1
state open
"""

[[keys]]
key = "Escape"
when = "In a submenu"
does = "Closes only the submenu; focus goes back to the item that opened it."
native = true
test = """
focus trigger
press Enter
press ArrowDown*3
press ArrowRight
press Escape
hidden sublist
focused subtrigger@1
state open
"""

[[keys]]
key = "Enter"
when = "On a submenu item"
does = "Chooses the item, closes the whole menu and returns focus to the trigger."
native = false
test = """
focus trigger
press Enter
press ArrowDown*3
press ArrowRight
press Enter
state closed
focused trigger
"""
