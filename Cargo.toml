[workspace]
resolver = "3"
# Globs, so a branch that adds a crate or app does not edit this line (docs/PROTOCOL.md).
members = ["crates/*", "apps/*"]
# Dioxus 0.8 branch: the native preview stays on 0.7 (its Blitz 0.2 fixes do not apply to Blitz 0.3).
exclude = ["apps/native"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/Amit-1of1/Rust-UI-"

[workspace.dependencies]
# Pinned to a minor version on purpose; see docs/GUARDRAILS.md.
dioxus = "=0.8.0-alpha.3"
# Upstream DioxusLabs/components primitives are unreleased (crates.io holds an empty 0.0.0
# placeholder), so we use our fork, published under its own name: `atoll-primitives`, library
# still `dioxus_primitives`. Dioxus 0.8 branch: Amit-1of1/dioxus-components, branch
# claude/project-thread-hgbr1g: the 0.7 fork commit (cda2513) ported to 0.8.0-alpha.3.
dioxus-primitives = { package = "atoll-primitives", version = "0.1.0", git = "https://github.com/Amit-1of1/dioxus-components", rev = "753e824dd5bdf6698f4ded2de731af7e5619170b" }
# `version` lets these be packaged for crates.io; see docs/PUBLISHING.md.
ui = { path = "crates/ui", package = "atoll-ui", version = "0.1.0" }
motion = { path = "crates/motion", package = "atoll-motion", version = "0.1.0" }
form-derive = { path = "crates/form-derive", package = "atoll-form-derive", version = "0.1.0" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Not `true`: on Rust 1.98+ (LLVM 23) that strips every custom section, including the one
# wasm-bindgen needs, and release web builds fail. `atoll postbuild` drops the wasm names.
strip = "debuginfo"

[profile.dev]
debug = 0

# Native (Blitz) fixes, carried on forks as small patches on the exact upstream releases we use.
# Pinned to commits; the branch each commit is on is named alongside. See docs/FORKS.md.
[patch.crates-io]
# The native renderer forks (Blitz 0.2, dioxus-native-dom 0.7.10) are for Dioxus 0.7; this branch
# builds the web and desktop targets only (docs/notes/dioxus-0.8.md).
# dioxus-motion's 0.8 port is a git dependency of crates/motion (not a patch), so apps get it too.
