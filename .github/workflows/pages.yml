name: Gallery on GitHub Pages

# Manual on purpose: it needs Pages enabled (Settings > Pages > Source: GitHub Actions)
# and installs dx from source, which is slow. Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx bundle --platform web --release --base-path Rust-UI-
        working-directory: apps/gallery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/gallery/release/web/public
      - id: deployment
        uses: actions/deploy-pages@v4
