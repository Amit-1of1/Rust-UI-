[[criterion]]
id = "1.4.13"
name = "Content on Hover or Focus"
level = "AA"
kit = "partial"
remarks = "Tooltip and hover card open on focus as well as hover and stay open while hovered. Escape-to-dismiss is part of the keyboard contract only for components that have one (listed under 2.1.1)."
evidence = ["tests/e2e/keyboard.mjs"]
components = ["tooltip", "hover_card", "popover"]

[[criterion]]
id = "2.1.1"
name = "Keyboard"
level = "A"
kit = "supports"
computed = "keyboard"
remarks = "Each interactive component has a keyboard contract (contract.toml) following its WAI-ARIA pattern; every documented key is pressed by a test in Chromium, Firefox and WebKit."
evidence = ["tests/e2e/contracts.mjs", "tests/e2e/keyboard.mjs", "docs/CONTRACTS.md"]

[[criterion]]
id = "2.1.2"
name = "No Keyboard Trap"
level = "A"
kit = "supports"
remarks = "Modal dialogs keep focus inside on purpose, and Escape closes them; the contracts test that Tab and Shift+Tab stay inside and Escape leaves."
evidence = ["crates/ui/src/components/dialog/contract.toml", "tests/e2e/contracts.mjs"]

[[criterion]]
id = "2.1.4"
name = "Character Key Shortcuts"
level = "A"
kit = "supports"
remarks = "The only global shortcut is Ctrl+K for the command palette (`use_hotkey`), which uses a modifier."
app = "Any single-key shortcut the app adds must be possible to turn off or remap."
evidence = ["tests/e2e/hotkey.mjs"]
components = ["command"]

[[criterion]]
id = "2.2.1"
name = "Timing Adjustable"
level = "A"
