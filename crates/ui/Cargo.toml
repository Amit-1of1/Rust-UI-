[package]
name = "rust-ui-kit"
version = "0.1.0"
description = "Personal shadcn-inspired component kit for Dioxus"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dioxus", "ui", "components", "shadcn"]
categories = ["gui", "wasm"]
# crates.io rejects git dependencies, and dioxus-primitives is git-only (crates.io holds an
# empty 0.0.0 placeholder). Install from git or copy components instead; docs/PUBLISHING.md.
publish = false

[lib]
name = "ui"

[dependencies]
dioxus.workspace = true
dioxus-primitives.workspace = true
motion.workspace = true
time = { version = "0.3.44", features = ["std", "macros"] }
palette = "0.7.6"
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "KeyboardEvent", "EventTarget", "MediaQueryList", "Navigator", "Clipboard"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
# The integration tests walk every demo.
rust-ui-kit = { path = ".", features = ["demos"] }
dioxus-ssr = "0.7.0"
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
# The gallery and docs demos (`ui::demos`). Off by default so apps don't ship demo code and
# demo CSS; the gallery, the docs site, apps/native and the kit's own tests turn it on.
# Internal (docs/STABILITY.md).
demos = []
web = ["dioxus-primitives/web", "motion/web"]
desktop = ["motion/desktop"]
# dioxus-native (Blitz). Nothing in the kit needs it any more (docs/NATIVE.md); kept so
# apps that turn it on keep building. Experimental (docs/STABILITY.md).
native = []
# Kit links (`TextLink`, `BreadcrumbLink`, `PaginationLink`) navigate through the Dioxus router
# when one is present, and `MainContent` moves focus after a route change. Experimental
# (docs/STABILITY.md).
router = ["dioxus/router"]
