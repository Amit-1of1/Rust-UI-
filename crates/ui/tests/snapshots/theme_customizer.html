<div data-rui-scope="" style="display: contents;">
<div class="dx-theme-customizer-css">
<fieldset class="dx-theme-group-css">
<legend>Look
</legend>
<div class="dx-theme-presets-css">
<label class="dx-theme-preset-css" data-preset="lagoon" title="Deep lagoon teal on warm greys, Reshaped proportions">
<input type="radio" name="dx-theme-preset-n0" value="lagoon" checked=true/>
<span class="dx-theme-preset-name-css">lagoon
</span>
<span class="dx-theme-preset-fonts-css">Inter
</span>
</label>
<label class="dx-theme-preset-css" data-preset="reef" title="Coral pink on rosy greys, round and a little roomier">
<input type="radio" name="dx-theme-preset-n0" value="reef"/>
<span class="dx-theme-preset-name-css">reef
</span>
<span class="dx-theme-preset-fonts-css">Geist
</span>
</label>
<label class="dx-theme-preset-css" data-preset="abyss" title="Indigo on cool slate, square and compact">
<input type="radio" name="dx-theme-preset-n0" value="abyss"/>
<span class="dx-theme-preset-name-css">abyss
</span>
<span class="dx-theme-preset-fonts-css">IBM Plex Sans
</span>
</label>
<label class="dx-theme-preset-css" data-preset="driftwood" title="Weathered bronze on warm sand, serif headings">
<input type="radio" name="dx-theme-preset-n0" value="driftwood"/>
<span class="dx-theme-preset-name-css">driftwood
</span>
<span class="dx-theme-preset-fonts-css">Source Serif 4 + Inter
</span>
</label>
<label class="dx-theme-preset-css" data-preset="classic" title="Plain black and white, system fonts, nothing to download">
<input type="radio" name="dx-theme-preset-n0" value="classic"/>
<span class="dx-theme-preset-name-css">classic
</span>
<span class="dx-theme-preset-fonts-css">System fonts
</span>
</label>
</div>
</fieldset>
<fieldset class="dx-theme-group-css">
<legend>Accent colour
</legend>
<div class="dx-theme-swatches-css">
<label class="dx-theme-swatch-css">
<input type="radio" name="theme-accent" value="neutral" checked=true/>
<span class="dx-theme-dot-css" aria-hidden="true">
</span>
<span>lagoon
</span>
</label>
<label class="dx-theme-swatch-css" data-accent="blue">
<input type="radio" name="theme-accent" value="blue"/>
<span class="dx-theme-dot-css" aria-hidden="true">
</span>
<span>blue
</span>
</label>
<label class="dx-theme-swatch-css" data-accent="green">
<input type="radio" name="theme-accent" value="green"/>
<span class="dx-theme-dot-css" aria-hidden="true">
</span>
<span>green
</span>
</label>
<label class="dx-theme-swatch-css" data-accent="violet">
<input type="radio" name="theme-accent" value="violet"/>
<span class="dx-theme-dot-css" aria-hidden="true">
</span>
<span>violet
</span>
</label>
<label class="dx-theme-swatch-css" data-accent="rose">
<input type="radio" name="theme-accent" value="rose"/>
<span class="dx-theme-dot-css" aria-hidden="true">
</span>
<span>rose
</span>
</label>
<label class="dx-theme-swatch-css" data-accent="orange">
<input type="radio" name="theme-accent" value="orange"/>
<span class="dx-theme-dot-css" aria-hidden="true">
</span>
<span>orange
</span>
</label>
</div>
</fieldset>
<div class="dx-theme-group-css">
<label for="theme-radius">Corner radius: 10px
</label>
<input id="theme-radius" type="range" min="0" max="20" value="10"/>
</div>
<fieldset class="dx-theme-group-css">
<legend>Density
</legend>
<div class="dx-theme-swatches-css">
<label class="dx-theme-swatch-css">
<input type="radio" name="theme-density" value="compact"/>
<span>compact
</span>
</label>
<label class="dx-theme-swatch-css">
<input type="radio" name="theme-density" value="default" checked=true/>
<span>default
</span>
</label>
<label class="dx-theme-swatch-css">
<input type="radio" name="theme-density" value="comfortable"/>
<span>comfortable
</span>
</label>
</div>
</fieldset>
<fieldset class="dx-theme-group-css">
<legend>Mode
</legend>
<div class="dx-theme-swatches-css">
<label class="dx-theme-swatch-css">
<input type="radio" name="theme-mode" value="system" checked=true/>
<span>System
</span>
</label>
<label class="dx-theme-swatch-css">
<input type="radio" name="theme-mode" value="light"/>
<span>Light
</span>
</label>
<label class="dx-theme-swatch-css">
<input type="radio" name="theme-mode" value="dark"/>
<span>Dark
</span>
</label>
</div>
</fieldset>
</div>
</div>
