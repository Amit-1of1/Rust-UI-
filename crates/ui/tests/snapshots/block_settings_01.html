<main data-block="settings_01" class="dx-block-settings-css">
<header class="dx-block-settings-header-css">
<h1 class="dx-block-settings-title-css">Settings
</h1>
<p class="dx-block-settings-muted-css">Manage your profile, emails and appearance.
</p>
</header>
<div data-orientation="horizontal" data-disabled=false class=" dx-tabs-css" data-variant="default">
<div role="tablist" aria-label="Settings sections" class="dx-tabs-list-css dx-block-settings-tabs-css">
<button role="tab" type="button" id="rui-tabs-n0-tab-n0" tabindex="-1" aria-selected=true data-state="active" data-disabled=false class="dx-tabs-trigger-css ">Profile
</button>
<button role="tab" type="button" id="rui-tabs-n0-tab-n1" tabindex="-1" aria-selected=false data-state="inactive" data-disabled=false class="dx-tabs-trigger-css ">Notifications
</button>
<button role="tab" type="button" id="rui-tabs-n0-tab-n2" tabindex="-1" aria-selected=false data-state="inactive" data-disabled=false class="dx-tabs-trigger-css ">Appearance
</button>
<button role="tab" type="button" id="rui-tabs-n0-tab-n3" tabindex="-1" aria-selected=false data-state="inactive" data-disabled=false class="dx-tabs-trigger-css ">Account
</button>
</div>
<div role="tabpanel" tabindex="0" id="dxc-n0" data-state="active" aria-labelledby="rui-tabs-n0-tab-n0" class=" dx-tabs-content-css dx-tabs-content-themed-css">
<div data-slot="card" class="dx-card-css">
<div data-slot="card-header" class="dx-card-header-css">
<div data-slot="card-title" class="dx-card-title-css">
<h2 class="dx-block-settings-card-title-css">Profile
</h2>
</div>
<div data-slot="card-description" class="dx-card-description-css">How you appear to others.
</div>
</div>
<div data-slot="card-content" class="dx-card-content-css">
<div>
<form novalidate=true aria-label="Profile" class="dx-form-css">
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n0" class="dx-field-label-css">Name
</label>
<input autocomplete="name" class="dx-input-css" id="dx-field-n0" type="text" value="">
</input>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n1" class="dx-field-label-css">Email
</label>
<input autocomplete="email" class="dx-input-css" id="dx-field-n1" type="email" value="">
</input>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n2" class="dx-field-label-css">Bio
</label>
<textarea data-slot="textarea" data-style="default" data-autosize="true" aria-describedby="dx-field-n2-description" class="dx-textarea-css" id="dx-field-n2" value="">
</textarea>
<p id="dx-field-n2-description" class="dx-field-description-css">Up to 280 characters.
</p>
</div>
<div class="dx-block-settings-actions-css">
<p role="status" class="dx-block-settings-muted-css">
</p>
<button class="dx-button-css" data-size="default" data-style="primary" type="submit">Save
</button>
</div>
</form>
</div>
</div>
</div>
</div>
<div role="tabpanel" tabindex="0" id="dxc-n1" data-state="inactive" hidden=true aria-labelledby="rui-tabs-n0-tab-n1" class=" dx-tabs-content-css dx-tabs-content-themed-css">
</div>
<div role="tabpanel" tabindex="0" id="dxc-n2" data-state="inactive" hidden=true aria-labelledby="rui-tabs-n0-tab-n2" class=" dx-tabs-content-css dx-tabs-content-themed-css">
</div>
<div role="tabpanel" tabindex="0" id="dxc-n3" data-state="inactive" hidden=true aria-labelledby="rui-tabs-n0-tab-n3" class=" dx-tabs-content-css dx-tabs-content-themed-css">
</div>
</div>
</main>
