[package]
name = "rust-ui-kit"
version = "0.1.0"
description = "Personal shadcn-inspired component kit for Dioxus"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ui"

[dependencies]
dioxus.workspace = true
dioxus-primitives.workspace = true
dioxus-icons.workspace = true
motion.workspace = true
time = { version = "0.3.44", features = ["std", "macros"] }
palette = "0.7.6"
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "KeyboardEvent", "EventTarget"] }
wasm-bindgen = "0.2"

[dev-dependencies]
dioxus-ssr = "0.7.0"

[features]
web = ["dioxus-primitives/web", "motion/web"]
desktop = ["motion/desktop"]
