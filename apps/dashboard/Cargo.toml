[package]
name = "dashboard"
version = "0.1.0"
description = "Acme Admin: a small admin dashboard built only from the kit, to find gaps (see GAPS.md)"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dioxus.workspace = true
ui.workspace = true
dioxus-icons.workspace = true
time = { version = "0.3.44", features = ["std", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "DomStringMap"] }

[features]
default = ["web"]
web = ["dioxus/web", "ui/web"]
desktop = ["dioxus/desktop", "ui/desktop"]
# Release builds split the wasm (scripts/release-web.sh turns this on): see src/main.rs for
# what loads later.
wasm-split = ["dioxus/wasm-split"]
