- heading "Pagination" [level=2]
- paragraph: Page navigation.
- navigation "Pagination":
  - list:
    - listitem:
      - link "Go to previous page":
        - /url: "#"
        - text: Previous
    - listitem:
      - link "1":
        - /url: "#"
    - listitem:
      - link "2":
        - /url: "#"
    - listitem:
      - link "3":
        - /url: "#"
    - listitem: More pages
    - listitem:
      - link "Go to next page":
        - /url: "#"
        - text: Next
- navigation "Pages of results":
  - list:
    - listitem:
      - button "Go to previous page": Previous
    - listitem:
      - button "Page 1": "1"
    - listitem: More pages
    - listitem:
      - button "Page 5": "5"
    - listitem:
      - button "Page 6": "6"
    - listitem:
      - button "Page 7": "7"
    - listitem: More pages
    - listitem:
      - button "Page 20": "20"
    - listitem:
      - button "Go to next page": Next
    - listitem:
      - text: Rows per page
      - combobox "Rows per page":
        - option "10"
        - option "25" [selected]
        - option "50"
- navigation "Pages of the activity feed":
  - list:
    - listitem:
      - button "Go to previous page" [disabled]: Previous
    - listitem: Page 1
    - listitem:
      - button "Go to next page": Next
