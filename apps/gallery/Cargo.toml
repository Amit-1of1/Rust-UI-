[package]
name = "gallery"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dioxus.workspace = true
ui = { workspace = true, features = ["demos"] }

# Reads `#block/<name>` so a block can open on its own page (src/main.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

[features]
default = ["web"]
web = ["dioxus/web", "ui/web"]
desktop = ["dioxus/desktop", "ui/desktop"]
# Android and iOS in the system webview (what `dx build --platform android` builds).
mobile = ["dioxus/mobile", "ui/desktop"]
native = ["dioxus/native", "ui/native"]
# Release builds split the wasm (scripts/release-web.sh turns this on): see src/main.rs for
# what loads later.
wasm-split = ["dioxus/wasm-split"]
