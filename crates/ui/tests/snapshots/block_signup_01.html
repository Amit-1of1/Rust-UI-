<main data-block="signup_01" class="dx-block-signup-css">
<div data-slot="card" class="dx-card-css dx-block-signup-card-css">
<div data-slot="card-header" class="dx-card-header-css">
<div data-slot="card-title" class="dx-card-title-css">
<h1 class="dx-block-signup-title-css">Create an account
</h1>
</div>
<div data-slot="card-description" class="dx-card-description-css">It takes a minute. No card needed.
</div>
</div>
<div data-slot="card-content" class="dx-card-content-css">
<form novalidate=true aria-label="Create an account" class="dx-form-css">
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n0" class="dx-field-label-css">Name
</label>
<input autocomplete="name" class="dx-input-css" id="dx-field-n0" type="text" value="">
</input>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n1" class="dx-field-label-css">Email
</label>
<input autocomplete="email" class="dx-input-css" id="dx-field-n1" placeholder="you@example.com" type="email" value="">
</input>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n2" class="dx-field-label-css">Password
</label>
<input aria-describedby="dx-field-n2-description" autocomplete="new-password" class="dx-input-css" id="dx-field-n2" type="password" value="">
</input>
<p id="dx-field-n2-description" class="dx-field-description-css">At least 8 characters.
</p>
</div>
<div data-slot="field" class="dx-field-css">
<label for="dx-field-n3" class="dx-field-label-css">Confirm password
</label>
<input autocomplete="new-password" class="dx-input-css" id="dx-field-n3" type="password" value="">
</input>
</div>
<div data-slot="field" class="dx-field-css">
<div class="dx-form-check-css">
<button type="button" role="checkbox" value="on" aria-checked="false" aria-required=false data-state="unchecked" data-disabled=false class="dx-checkbox-css" id="dx-field-n4">
<span data-state="unchecked" data-disabled=false class="dx-checkbox-indicator-css">
</span>
</button>
<input type="checkbox" aria-hidden="true" tabindex="-1" id="dxc-n0" name="" value="on" style="position:absolute;pointer-events:none;opacity:0;margin:0;transform:translateX(-100%);"/>
<label for="dx-field-n4" class="dx-field-label-css">I agree to the terms of service
</label>
</div>
</div>
<p class="dx-block-signup-muted-css">
<a href="#terms" class="dx-link-css">Read the terms
</a>
</p>
<button class="dx-button-css dx-block-signup-submit-css" data-size="default" data-style="primary" type="submit">Create account
</button>
</form>
</div>
<div data-slot="card-footer" class="dx-card-footer-css">
<p class="dx-block-signup-footer-css">Already have an account? 
<a href="#sign-in" class="dx-link-css">Sign in
</a>
</p>
</div>
</div>
</main>
