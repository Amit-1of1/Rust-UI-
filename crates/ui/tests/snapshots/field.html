<form style="display: grid; gap: 1rem; max-width: 20rem;" novalidate=true>
<div class="dx-field-css" data-slot="field">
<label class="dx-field-label-css" for="dx-field-n0">Email
</label>
<input class="dx-input-css" id="dx-field-n0" type="email" placeholder="you@example.com" value="" aria-describedby="dx-field-n0-description">
</input>
<p class="dx-field-description-css" id="dx-field-n0-description">We never share it.
</p>
</div>
<div class="dx-field-css" data-slot="field">
<label class="dx-field-label-css" for="dx-field-n1">Password
</label>
<input class="dx-input-css" id="dx-field-n1" type="password" value="" aria-describedby="dx-field-n1-description">
</input>
<p class="dx-field-description-css" id="dx-field-n1-description">At least 8 characters.
</p>
</div>
<button class="dx-button-css" data-size="default" data-style="primary" type="submit">Create account
</button>
</form>
