name: Docs and gallery on GitHub Pages

# Manual on purpose: it needs Pages enabled (Settings > Pages > Source: GitHub Actions)
# and installs dx from source, which is slow. Run it from the Actions tab.
# One-time repo setup and a local reproduction: docs/PUBLISHING.md.
# The base paths below must match the repo name (https://<owner>.github.io/<repo>/).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # dx 0.7.10 with the wasm splitter fixes (docs/FORKS.md); the gallery is a split build.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dx
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ runner.os }}-${{ hashFiles('scripts/install-dx.sh') }}
      - if: steps.dx.outputs.cache-hit != 'true'
        run: scripts/install-dx.sh
      # The docs site is the landing page; the gallery lives under /gallery/.
      # release-web.sh = dx release build (split where the app has a `wasm-split` feature),
      # then one stylesheet per app instead of one per component (see crates/cli/README.md).
      - run: scripts/release-web.sh docs --base-path Rust-UI-
      - run: scripts/release-web.sh gallery --base-path Rust-UI-/gallery
      - run: |
          mkdir -p public
          cp -r target/dx/docs/release/web/public/. public/
          mkdir -p public/gallery
          cp -r target/dx/gallery/release/web/public/. public/gallery/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
