[package]
name = "native"
version = "0.1.0"
description = "Renders one kit demo on the native (Blitz) renderer, for the native smoke test"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["native"] }
ui = { workspace = true, features = ["native"] }

[dev-dependencies]
dioxus-native-dom = "=0.7.10"
blitz-traits = "0.2"
manganis-core = "=0.7.10"
blitz-paint = "0.2.1"
anyrender = "0.6.2"
anyrender_vello_cpu = "0.8.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
blitz-dom = { version = "0.2.4", default-features = false }
keyboard-types = { version = "0.7", default-features = false }
