<div class="dx-theme-customizer-ee1ee7de">
<fieldset class="dx-theme-group-ee1ee7de">

</legend>

</span>

</span>
</label>
<label class="dx-theme-swatch-ee1ee7de" data-accent="blue">

<span class="dx-theme-dot-ee1ee7de" aria-hidden="true">
</span>
<span>blue
</span>
</label>
<label class="dx-theme-swatch-ee1ee7de" data-accent="green">
<input type="radio" name="theme-accent" value="green"/>
<span class="dx-theme-dot-ee1ee7de" aria-hidden="true">
</span>
<span>green
</span>
</label>
<label class="dx-theme-swatch-ee1ee7de" data-accent="violet">
<input type="radio" name="theme-accent" value="violet"/>
<span class="dx-theme-dot-ee1ee7de" aria-hidden="true">
</span>
<span>violet
</span>
</label>
<label class="dx-theme-swatch-ee1ee7de" data-accent="rose">
<input type="radio" name="theme-accent" value="rose"/>
<span class="dx-theme-dot-ee1ee7de" aria-hidden="true">
</span>

</span>
</label>
<label class="dx-theme-swatch-ee1ee7de" data-accent="orange">

</span>
</label>
</div>
</fieldset>

</label>

<fieldset class="dx-theme-group-ee1ee7de">
<legend>Density
</legend>
<div class="dx-theme-swatches-ee1ee7de">
<label class="dx-theme-swatch-ee1ee7de">
<input type="radio" name="theme-density" value="compact"/>

</span>
</label>
<label class="dx-theme-swatch-ee1ee7de">
<input type="radio" name="theme-density" value="default" checked=true/>

</label>
<label class="dx-theme-swatch-ee1ee7de">
<input type="radio" name="theme-density" value="comfortable"/>

</span>

</div>
</fieldset>
<fieldset class="dx-theme-group-ee1ee7de">

<input type="radio" name="theme-mode" value="system" checked=true/>

</span>
</label>
<label class="dx-theme-swatch-ee1ee7de">
<input type="radio" name="theme-mode" value="light"/>

</span>
</label>
<label class="dx-theme-swatch-ee1ee7de">
<input type="radio" name="theme-mode" value="dark"/>

</span>
</label>
</div>
</fieldset>
</div>
