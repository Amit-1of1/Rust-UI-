[package]
name = "docs"
version = "0.1.0"
description = "Documentation site for the Atoll kit: one page per component with its live demo"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dioxus.workspace = true
ui = { workspace = true, features = ["demos", "contract-check"] }
# The theme builder converts the colour picker's HSV value (the version the kit uses).
palette = "0.7.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location"] }

[features]
default = ["web"]
web = ["dioxus/web", "ui/web"]
desktop = ["dioxus/desktop", "ui/desktop"]
# Release builds split the wasm (scripts/release-web.sh turns this on): every page but the
# home page loads later (src/main.rs, `DocPage`).
wasm-split = ["dioxus/wasm-split"]
