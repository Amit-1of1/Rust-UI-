# Keyboard and accessibility contract (docs/CONTRACTS.md): the docs table is generated from it,
# and tests/e2e/contracts.mjs (web) and apps/native/tests/contracts.rs (Blitz) run every row.
pattern = "Disclosure (Show/Hide)"
apg = "disclosure"
roles = []

[parts]
trigger = "[data-slot=tool-call] button[aria-expanded]"

[[keys]]
key = "Enter"
when = "On a tool call's header"
does = "Shows or hides its details."
native = true
test = """
focus trigger
press Enter
attr trigger aria-expanded=true
press Enter
attr trigger aria-expanded=false
"""

[[keys]]
key = "Space"
when = "On a tool call's header"
does = "Shows or hides its details."
native = true
test = """
focus trigger
press Space
attr trigger aria-expanded=true
"""
