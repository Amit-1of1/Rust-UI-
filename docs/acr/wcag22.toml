# What the kit's components do for each WCAG 2.2 Level A and AA success criterion, and the
# checks that show it. `atoll acr` turns this into a draft Accessibility Conformance Report
# (VPAT 2.5 layout) for the components an app uses; docs/ACR.md explains it.
#
# kit      supports | partial | does-not-support | not-applicable | not-evaluated
#          (what the kit's components do; not-evaluated means no check exists yet)
# remarks  what the kit does, in the report's words
# app      what the app itself still has to do for the criterion (optional)
# evidence files, or `file::test_fn`, that back the remark; crates/cli/tests/acr.rs fails if
#          one disappears
# components  the only components the criterion is about: Not Applicable when none is used
# computed "keyboard" or "focus": the conformance and remarks also list, per component the
#          app uses, the keyboard contract and its recorded gaps (contract.toml)

[[criterion]]
id = "1.1.1"
name = "Non-text Content"
level = "A"
kit = "supports"
remarks = "Image slots that need a text alternative make it a required prop: `AvatarImage` and `ImageAvatar` do not compile without `alt`, and `IconButton` does not compile without `label`. Decorative icons are `aria-hidden`. Charts carry a `<title>` and a `<desc>` text summary."
app = "Write meaningful `alt`, `label` and chart titles; review images and icons outside kit components."
evidence = ["crates/ui/src/components/avatar/component.rs", "crates/ui/src/components/button/component.rs", "crates/ui/tests/aria.rs::every_demo_passes_the_aria_check"]

[[criterion]]
id = "1.2.1"
name = "Audio-only and Video-only (Prerecorded)"
level = "A"
kit = "not-applicable"
remarks = "The kit has no audio or video components."
app = "Provide alternatives for any media the app plays."
evidence = []

[[criterion]]
id = "1.2.2"
name = "Captions (Prerecorded)"
level = "A"
kit = "not-applicable"
remarks = "The kit has no audio or video components."
app = "Caption any prerecorded video the app plays."
evidence = []

[[criterion]]
id = "1.2.3"
name = "Audio Description or Media Alternative (Prerecorded)"
level = "A"
kit = "not-applicable"
remarks = "The kit has no audio or video components."
app = "Provide audio description or a transcript for prerecorded video."
evidence = []

[[criterion]]
id = "1.3.1"
name = "Info and Relationships"
level = "A"
kit = "supports"
remarks = "Components expose their structure through native elements and WAI-ARIA roles; labels, descriptions and errors are linked with `aria-labelledby` / `aria-describedby`. Every demo's server-rendered HTML is checked in `cargo test` for idrefs that point nowhere, duplicate ids, unknown roles and attributes, and roles missing required state; the browser checks compare each component's accessibility tree with a reviewed snapshot."
app = "Use headings, landmarks and lists in the app's own markup."
evidence = ["crates/ui/tests/aria.rs::every_demo_passes_the_aria_check", "tests/e2e/a11y_tree.mjs", "tests/e2e/axe.mjs"]

[[criterion]]
id = "1.3.2"
name = "Meaningful Sequence"
level = "A"
kit = "supports"
remarks = "Overlay content is rendered in reading order next to its trigger; the kit uses logical CSS properties and is also checked with `dir=rtl`."
app = "Keep the app's DOM order the same as its visual order."
evidence = ["tests/e2e/axe.mjs", "crates/cli/src/doctor.rs"]

[[criterion]]
id = "1.3.3"
name = "Sensory Characteristics"
level = "A"
kit = "supports"
remarks = "Kit strings (`UiStrings`) never refer to shape, colour or position alone."
app = "Instructions written in the app must not rely on shape, size, position or sound."
evidence = ["crates/ui/src/components/ui_strings/component.rs"]

[[criterion]]
id = "1.2.4"
name = "Captions (Live)"
level = "AA"
kit = "not-applicable"
remarks = "The kit has no audio or video components."
app = "Caption live audio the app streams."
evidence = []

[[criterion]]
id = "1.2.5"
name = "Audio Description (Prerecorded)"
level = "AA"
kit = "not-applicable"
remarks = "The kit has no audio or video components."
app = "Provide audio description for prerecorded video."
evidence = []

[[criterion]]
id = "1.3.4"
name = "Orientation"
level = "AA"
kit = "supports"
remarks = "No component locks orientation; layouts are fluid."
app = "Do not lock the app to one orientation."
evidence = []

[[criterion]]
id = "1.3.5"
name = "Identify Input Purpose"
level = "AA"
kit = "partial"
remarks = "`TextField` passes `autocomplete` through, but it is optional; the kit cannot know a field's purpose."
app = "Set `autocomplete` on fields that collect the user's own data (name, email, address)."
evidence = ["crates/ui/src/components/form/component.rs"]
components = ["form"]

[[criterion]]
id = "1.4.1"
name = "Use of Color"
level = "A"
kit = "supports"
remarks = "State is never shown by colour alone: `Status` keeps a text label, form errors have text, checked and selected states have a mark or an ARIA state. In forced-colors mode every control keeps a visible edge."
evidence = ["tests/e2e/forced_colors.mjs"]

[[criterion]]
id = "1.4.2"
name = "Audio Control"
level = "A"
kit = "not-applicable"
remarks = "The kit plays no audio."
evidence = []

[[criterion]]
id = "1.4.3"
name = "Contrast (Minimum)"
level = "AA"
kit = "supports"
remarks = "Proven from the stylesheets, not sampled: every text colour each component draws, including hover, pressed, selected and focus states, is checked against the background it is drawn on, in light and dark and under every accent preset (4.5:1, or 3:1 for large text). axe also scans every demo in light, dark and each accent."
app = "Run `atoll contrast --theme <your theme.css>` on any theme you generate or edit, and check colours in your own CSS."
evidence = ["crates/cli/tests/contrast.rs::every_pair_meets_wcag_aa_in_both_modes_and_every_accent", "crates/cli/tests/contrast.rs::the_proof_covers_every_component_mode_and_accent", "tests/e2e/axe.mjs"]

[[criterion]]
id = "1.4.4"
name = "Resize Text"
level = "AA"
kit = "not-evaluated"
remarks = "Not measured yet: no automated check zooms text to 200% and looks for clipped content."
app = "Test the app at 200% text size."
evidence = []

[[criterion]]
id = "1.4.5"
name = "Images of Text"
level = "AA"
kit = "supports"
remarks = "Components render text as text; icons are SVG."
evidence = []

[[criterion]]
id = "1.4.10"
name = "Reflow"
level = "AA"
kit = "not-evaluated"
remarks = "Not measured yet at 320 CSS pixels wide."
app = "Test the app's layouts at 320 CSS pixels."
evidence = []

[[criterion]]
id = "1.4.11"
name = "Non-text Contrast"
level = "AA"
kit = "partial"
remarks = "Focus rings are proven at 3:1 against what is around them and icons at 3:1, from the stylesheets in both modes and every accent; chart series colours are tested at 3:1; forced-colors mode keeps every control's edge. Input and control borders at rest are not yet part of the proof."
evidence = ["crates/cli/tests/contrast.rs::every_pair_meets_wcag_aa_in_both_modes_and_every_accent", "crates/ui/tests/theme.rs::chart_colours_meet_non_text_contrast_in_both_modes", "tests/e2e/forced_colors.mjs"]

[[criterion]]
id = "1.4.12"
